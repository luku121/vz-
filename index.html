<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculadora básica">
      <h1>Calculadora</h1>

      <label for="display" class="sr-only">Resultado</label>
      <input id="display" class="display" type="text" value="0" readonly />

      <div class="keys" role="group" aria-label="Teclado numérico">
        <button data-action="clear" class="key key--accent">C</button>
        <button data-action="sign" class="key key--accent">±</button>
        <button data-action="percent" class="key key--accent">%</button>
        <button data-action="operator" data-value="/" class="key key--operator">÷</button>

        <button data-action="digit" data-value="7" class="key">7</button>
        <button data-action="digit" data-value="8" class="key">8</button>
        <button data-action="digit" data-value="9" class="key">9</button>
        <button data-action="operator" data-value="*" class="key key--operator">×</button>

        <button data-action="digit" data-value="4" class="key">4</button>
        <button data-action="digit" data-value="5" class="key">5</button>
        <button data-action="digit" data-value="6" class="key">6</button>
        <button data-action="operator" data-value="-" class="key key--operator">−</button>

        <button data-action="digit" data-value="1" class="key">1</button>
        <button data-action="digit" data-value="2" class="key">2</button>
        <button data-action="digit" data-value="3" class="key">3</button>
        <button data-action="operator" data-value="+" class="key key--operator">+</button>

        <button data-action="digit" data-value="0" class="key key--double">0</button>
        <button data-action="decimal" class="key">.</button>
        <button data-action="equals" class="key key--operator">=</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
